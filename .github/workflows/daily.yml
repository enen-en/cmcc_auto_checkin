name: 中国移动每日签到自动化

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cmcc-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 执行中国移动签到并推送飞书
        id: run
        env:
          CMCC_COOKIE: ${{ secrets.CMCC_COOKIE }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RESULT_FILE: ${{ runner.temp }}/cmcc_result.txt
        run: |
          set -uo pipefail
          set +e
          python3 cmcc_auto.py
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -ne 0 ]; then
            echo "::warning::本轮签到存在失败项，详见上方日志与飞书卡片"
          fi
          exit 0

      - name: 汇总
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/cmcc_result.txt
        run: |
          set -uo pipefail
          {
            echo "### 中国移动每日签到自动化"
            echo ""
            echo "- 运行时间：$(date -u '+%Y-%m-%d %H:%M:%S UTC')（cron 为 UTC）"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RESULT_FILE" ]; then
            cat "$RESULT_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 未产出结论文案，请查看上方日志" >> "$GITHUB_STEP_SUMMARY"
          fi
